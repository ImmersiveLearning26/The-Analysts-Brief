<!doctype html>
<html lang="en"
  data-composition-variables='[
    {"id":"hookLine","type":"string","label":"Hook line","default":"Kalinda is in crisis."},
    {"id":"tagline","type":"string","label":"Tagline","default":"Check the evidence. Test the causes. Brief the Chair."},
    {"id":"credit","type":"string","label":"Credit line","default":"Miva Open University · IRS 103"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./lib/three/build/three.module.js", "three/addons/": "./lib/three/addons/" } }
    </script>
    <style>
      @font-face { font-family: "Afacad"; src: url("assets/fonts/afacad-latin-wght-normal.woff2") format("woff2"); font-weight: 400 700; font-style: normal; }
      @font-face { font-family: "Afacad"; src: url("assets/fonts/afacad-latin-wght-italic.woff2") format("woff2"); font-weight: 400 700; font-style: italic; }
      @font-face { font-family: "Manrope"; src: url("assets/fonts/Manrope-VariableFont_wght.ttf") format("truetype"); font-weight: 200 800; }
      :root {
        --warm: #f4f3ee;
        --ink: #1d2321;
        --ink-dark: #f2f0fa;
        --tan: #a8763e;
        --tan-dark: #c9a46a;
        --hot: #ff7a1a;
        --navy: #1f3a5f;
        --display: "Afacad", sans-serif;
        --body: "Manrope", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--warm); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: var(--body); }
      #ground { position: absolute; inset: 0; z-index: 0; background: var(--warm); }
      #world-clip { position: absolute; inset: 0; z-index: 2; }
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
      #pin { position: absolute; left: 0; top: 0; z-index: 3; opacity: 0; pointer-events: none; }
      #pin .head { position: absolute; left: -22px; top: -58px; width: 44px; height: 44px; border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, var(--hot) 0 7px, #ffffffe6 8px); box-shadow: 0 0 0 1px #ffffff, 0 10px 24px #2830293d; }
      #pin .stem { position: absolute; left: -1px; top: -16px; width: 2px; height: 16px; background: #ffffffd0; }
      #pin .ring { position: absolute; left: -22px; top: -58px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--hot);
        transform: scale(calc(1 + var(--ring, 0) * 1.4)); opacity: calc(0.9 - var(--ring, 0) * 0.9); }
      #wash { position: absolute; inset: 0; z-index: 4; opacity: 0; pointer-events: none; }
      #globe-clip { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
      #globe { position: absolute; left: 0; top: 0; width: 600px; height: 600px; transform-origin: 300px 300px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div id="ground"></div>

      <div id="world-clip" class="clip" data-start="2.4" data-duration="18.2" data-track-index="1" data-track-kind="graphics">
        <canvas id="world" width="1920" height="1080"></canvas>
      </div>
      <div id="pin"><div class="ring"></div><div class="stem"></div><div class="head"></div></div>
      <div id="wash"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="2.4" data-duration="2.6" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index:5"></div>
      <div id="rooms" data-composition-id="rooms" data-composition-src="compositions/rooms.html"
        data-start="5" data-duration="15" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index:1"></div>
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="20" data-duration="4" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index:5"></div>

      <div id="globe-clip" class="clip" data-start="2.4" data-duration="21.6" data-track-index="5" data-track-kind="graphics">
        <canvas id="globe" width="600" height="600"></canvas>
      </div>

      <div id="ident" data-composition-id="ident" data-composition-src="compositions/ident.html"
        data-start="0" data-duration="2.4" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080"
        style="z-index:10"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module">
      import { createWorld } from "./lib/world.js";
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let world = null, last = 0;
      window.addEventListener("hf-seek", (e) => { last = e.detail.time; world?.render(last); });
      const ready = (async () => {
        try { await Promise.all([document.fonts.load('600 84px "Afacad"'), document.fonts.load('700 30px "Manrope"')]); } catch {}
        world = await createWorld({
          canvas: document.getElementById("world"), globeCanvas: document.getElementById("globe"),
          ground: document.getElementById("ground"), wash: document.getElementById("wash"), pin: document.getElementById("pin"),
        });
        world.render(last);
      })();
      window.__hf.buildReady.world = ready;
    </script>
  </body>
</html>
